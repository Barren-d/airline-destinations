name: Route scrape (AENA, ANA, Avinor, Swedavia, Isavia, BTS)

on:
  workflow_dispatch:        # manual only — trigger from the GitHub Actions tab ("Run workflow")

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies (with scraper extras)
        run: uv sync --extra scraper

      - name: Install Chromium for Playwright
        run: uv run playwright install chromium --with-deps

      # Each scraper may fail independently (site changes, bot protection); the commit
      # step still runs and picks up whichever snapshots were refreshed.
      - name: Run AENA scraper
        continue-on-error: true
        run: uv run python -m pyfly --source aena --scope aena

      - name: Run ANA (Portugal) scraper
        continue-on-error: true
        run: uv run python -m pyfly --source ana --scope portugal

      - name: Run Avinor Live (Norway) scraper
        continue-on-error: true
        run: uv run python -m pyfly --source avinor --scope norway

      - name: Run Avinor Feed (Norway) scraper
        continue-on-error: true
        run: uv run python -m pyfly --source avinor_feed --scope norway

      - name: Run Swedavia (Sweden) scraper
        continue-on-error: true
        run: uv run python -m pyfly --source swedavia --scope sweden

      - name: Run Isavia Domestic (Iceland) scraper
        continue-on-error: true
        run: uv run python -m pyfly --source isavia --scope iceland

      # Latest published month; rerunning before BTS publishes a new month just rewrites it
      - name: Download BTS T-100 (USA)
        continue-on-error: true
        run: uv run python -m pyfly --source bts --scope usa

      - name: Commit updated parquet snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/routes_aena.parquet data/routes_ana.parquet data/routes_avinor.parquet data/routes_avinor_feed.parquet data/routes_swedavia.parquet data/routes_isavia.parquet data/routes_bts.parquet data/history
          git diff --staged --quiet || git commit -m "data: route snapshots $(date -u +%Y-%m-%d)"
          git push
