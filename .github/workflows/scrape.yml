name: AENA + ANA route scrape

on:
  schedule:
    - cron: '0 4 1 * *'   # 04:00 UTC on the 1st of each month
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies (with scraper extras)
        run: uv sync --extra scraper

      - name: Install Chromium for Playwright
        run: uv run playwright install chromium --with-deps

      # Each scraper may fail independently (site changes, bot protection); the commit
      # step still runs and picks up whichever snapshots were refreshed.
      - name: Run AENA scraper
        continue-on-error: true
        run: uv run python -m pyfly --source aena --scope aena

      - name: Run ANA (Portugal) scraper
        continue-on-error: true
        run: uv run python -m pyfly --source ana --scope portugal

      - name: Commit updated parquet snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/routes_aena.parquet data/routes_ana.parquet
          git diff --staged --quiet || git commit -m "data: AENA + ANA route snapshots $(date -u +%Y-%m-%d)"
          git push
